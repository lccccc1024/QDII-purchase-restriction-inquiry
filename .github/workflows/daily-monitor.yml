name: Daily Fund Monitor

on:
  schedule:
    # UTC 10:00 = 北京时间 18:00
    - cron: "0 10 * * *"
  workflow_dispatch: {}
  # 只在 PR 上跑测试；本工作流会往 main 提交快照，加 push 触发会形成"提交→再跑"的循环
  pull_request:

permissions:
  contents: write

concurrency:
  group: fund-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Run monitor scan
        if: github.event_name != 'pull_request'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        # 通知发送失败时脚本以退出码 2 结束，让本次运行变红，避免"沉默=正常"的误判
        run: python monitor.py --once --email

      - name: Commit status snapshot
        # 通知失败时也要提交：快照与补发队列都靠仓库文件跨运行传递
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # changelog.csv 仅在有变化时生成，notify_state.json 仅在启用邮件时生成
          for f in status_log.json changelog.csv notify_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "::notice::快照无变化，无需提交"
          else
            git commit -m "chore: 更新基金监控快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi